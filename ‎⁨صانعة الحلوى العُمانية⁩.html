<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صانعة الحلوى العُمانية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3ea;--card:#fff;--ink:#3b2340;--line:#f3d9c6;--pri:#7a2e78;--ok:#22a06b;--no:#e2556b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1323;--card:#2b1e35;--ink:#fbeedd;--line:#4a3556;--pri:#f0a8ec}}
:root[data-theme="dark"]{--bg:#1c1323;--card:#2b1e35;--ink:#fbeedd;--line:#4a3556;--pri:#f0a8ec}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.6 Tajawal,system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{margin:0;font-size:clamp(1rem,4.4vw,1.35rem);font-weight:800;color:var(--pri)}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:2px 14px;font-weight:800;white-space:nowrap}
#pr{display:flex;gap:5px;margin-bottom:12px}
#pr span{flex:1;max-width:44px;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:var(--card);border:2px solid var(--line);opacity:.5;font-size:1.05rem;transition:.3s}
#pr .on{opacity:1;border-color:#f4a62a;transform:scale(1.15);box-shadow:0 0 0 3px #f4a62a55}
#pr .dn{opacity:1;background:#d6f5e6;border-color:var(--ok)}
.sc{border-radius:24px;overflow:hidden;box-shadow:0 8px 22px #7a2e7826}
svg{display:block;width:100%;height:auto}
#mix{transition:fill 1s}
#fl{transition:opacity 1s}
.fl{animation:fk .45s ease-in-out infinite alternate}
.fl:nth-child(2n){animation-delay:.25s}
@keyframes fk{to{opacity:.55}}
.stir{animation:sw 1.8s ease-in-out infinite;transform-origin:82px 148px}
@keyframes sw{50%{transform:rotate(-4deg)}}
#sm path{animation:up 2.4s linear infinite}
#sm path:nth-child(2){animation-delay:.8s}
#sm path:nth-child(3){animation-delay:1.6s}
@keyframes up{0%{transform:translateY(8px);opacity:0}50%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.dr{animation:dr 1s ease-in forwards}
@keyframes dr{0%{opacity:0;transform:translateY(-8px)}15%{opacity:1}80%{opacity:1;transform:translateY(46px)}100%{opacity:0;transform:translateY(58px)}}
.tw{animation:tw 1.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
.pn{background:var(--card);border-radius:24px;padding:16px;margin-top:12px;box-shadow:0 6px 18px #7a2e7818;animation:fi .4s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.chip{display:inline-block;background:#7a2e78;color:#fff;border-radius:99px;padding:2px 14px;font-weight:800;font-size:.9rem}
.d{margin:8px 0 2px;color:var(--pri);font-weight:700}
.q{margin:6px 0 14px;font-size:1.2rem;font-weight:800;line-height:1.9}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g button{font:inherit;font-size:1.3rem;font-weight:800;color:var(--ink);background:var(--card);border:3px solid;border-radius:18px;min-height:62px;padding:8px 4px;cursor:pointer;transition:transform .15s}
.g button:nth-child(1){border-color:#f4a62a}.g button:nth-child(2){border-color:#e8607a}.g button:nth-child(3){border-color:#1f8a8a}.g button:nth-child(4){border-color:#8a6be0}
.g button:active{transform:scale(.95)}
.g button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.g button.no{background:var(--no);border-color:var(--no);color:#fff;opacity:.55;animation:sk .35s}
@keyframes sk{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.hint,.sol{border-radius:14px;padding:10px 14px;margin-top:12px;font-weight:700}
.hint{background:#fff1cc;color:#5b4210}
.sol{background:#ddf6ea;color:#14573a}
.go{display:block;width:100%;margin-top:12px;font:inherit;font-size:1.15rem;font-weight:800;color:#fff;border:0;border-radius:16px;padding:12px;cursor:pointer;background:linear-gradient(90deg,#e8607a,#7a2e78)}
.go:focus-visible,.g button:focus-visible{outline:3px solid #f4a62a;outline-offset:2px}
.stars{font-size:2.2rem;text-align:center}
h2{margin:0 0 6px}
.f{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;font-size:.9em;margin:0 .15em}
.f i{font-style:normal;padding:0 .25em}
.f i:first-child{border-bottom:2px solid currentColor}
.m{display:inline-flex;align-items:center;gap:.1em;direction:ltr}
.ex{direction:ltr;text-align:center;font-weight:800;font-size:1.8rem;margin:4px 0 14px}.sol .ex{font-size:1.25rem;margin:4px 0 0}
.go,.g button,svg{touch-action:manipulation}
.pu{animation:pu .7s ease-in-out infinite alternate}@keyframes pu{to{transform:scale(1.3)}}
.pl{animation:gl .9s ease-in-out infinite alternate}@keyframes gl{to{box-shadow:0 0 0 7px #f4a62a77}}
.mb{height:18px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}.mb i{display:block;height:100%;background:linear-gradient(90deg,#f4a62a,#e8607a);border-radius:99px}
.wb{animation:wb .45s}@keyframes wb{40%{transform:translateY(4px)}}
#bb circle{transform-box:fill-box;animation:bu 1.6s ease-out infinite}#bb circle:nth-child(2){animation-delay:.4s}#bb circle:nth-child(3){animation-delay:.8s}#bb circle:nth-child(4){animation-delay:1.2s}
@keyframes bu{0%{transform:translateY(0) scale(.4);opacity:0}30%{opacity:.9}100%{transform:translateY(-12px) scale(1.2);opacity:0}}
button.pill{font:inherit;font-weight:800;color:var(--ink);cursor:pointer}
.fg{height:7px;border-radius:6px;margin-bottom:8px;background:linear-gradient(90deg,#fff 0 33.3%,#db161b 33.3% 66.6%,#008000 66.6%);box-shadow:0 0 0 1px var(--line)}
.tb{display:none;gap:6px;margin-top:12px;flex-wrap:wrap}.tb span{flex:1 1 30%;min-width:0;text-align:center;background:var(--card);border:3px solid var(--c);border-radius:14px;padding:2px 6px;font-weight:800;opacity:.6;transition:.2s}.tb .cur{opacity:1;background:var(--c);color:#fff;transform:scale(1.05)}
.fa{margin-top:8px;font-size:.92rem;font-weight:700;line-height:1.7}
.cd{background:#fff1cc;color:#5b4210;border-radius:14px;padding:12px;margin-top:10px;font-weight:700;line-height:1.8}
.vl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.vl span{background:#008000;color:#fff;border-radius:99px;padding:2px 12px;font-weight:700;font-size:.9rem}
.turn{font-weight:800;color:var(--pri);margin-bottom:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

const D=t=>String(t).replace(/\d/g,x=>'٠١٢٣٤٥٦٧٨٩'[x]);
const F=t=>D(t).replace(/([٠-٩]+)\/([٠-٩]+)/g,'<span class="f"><i>$1</i><i>$2</i></span>');
let i=0,sc=0,tr=0,lk=0,NT=1,ts=[0],tm=0;const TN=['المجموعة ١','المجموعة ٢','المجموعة ٣','المجموعة ٤','المجموعة ٥','المجموعة ٦'],TC=['#db161b','#008000','#e8a317','#7a2e78','#1f8a8a','#2f6fdb'];let t0=0;
function tb(){const e=$('tb');e.style.display=NT>1?'flex':'none';e.innerHTML=TN.slice(0,NT).map((n,j)=>`<span style="--c:${TC[j]}" class="${j==tm?'cur':''}">${n} <b>${D(ts[j])}</b></span>`).join('')}
$('pr').innerHTML=S.map(s=>`<span>${s.e}</span>`).join('');
function mark(){[...$('pr').children].forEach((c,j)=>c.className=j<i?'dn':j==i?'on':'')}
function pot(k){
 CK=k;$('mix').style.fill=k?S[k-1].c:'#5a3a2b';
 $('fl').style.opacity=[0,.4,.7,1,1,1,1][k];
 $('sm').style.opacity=Math.min(1,k*.18);
 $('nuts').style.opacity=k>=5?1:0;$('bb').style.opacity=k>=3?1:0;
 $('prop').textContent=S[k]?S[k].e:'';
}
function intro(){
 i=0;st=0;mt=0;pot(0);mark();tb();
 $('trayG').style.display='none';$('potG').style.display='';$('hearth').style.display='';$('arm').style.display='';
 $('pn').innerHTML=`<h2>🇴🇲 مرحباً بكِ في بيت الضيافة العُماني</h2><p>الحلوى العُمانية رمز كرم الضيافة وفرحة العيد. حلّي مسائل ضرب الكسور، واسكبي المكوّنات، وحرّكي الحلوى بسرعة حتى تنضج وتُقدَّم للضيوف!</p><p class="d">اختاري طريقة اللعب:</p><div class="g"><button onclick="start(6)">٦ مجموعات</button><button onclick="start(4)">٤ مجموعات</button><button onclick="start(3)">٣ مجموعات</button><button onclick="start(1)">لعب فردي</button></div><p class="d">اختاري طالبة من كل مجموعة لتحلّ سؤالاً، والمجموعة الأعلى نقاطاً تنال لقب «أمهر طاهية» 🏆</p>`;
}
function start(n){NT=n||1;ts=Array(NT).fill(0);tm=0;
 ac();CK=0;i=0;sc=0;$('sc').textContent=D(0);
 $('trayG').style.display='none';$('potG').style.display='';$('hearth').style.display='';
 $('arm').style.display='';say('هيا نبدأ الطبخ! 🍯');
 pot(0);show();
}
function show(){
 tr=0;lk=0;st=0;mt=0;tm=i%NT;t0=Date.now();tb();if(NT>1)say('دور '+TN[tm]);mark();$('prop').classList.remove('pu');const s=S[i];
 $('pn').innerHTML=`${NT>1?`<div class="turn">🙋 دور ${TN[tm]}: اختاري طالبة لتحلّ السؤال</div>`:''}<span class="chip">المرحلة ${D(i+1)} من ${D(S.length)}: ${s.n}</span><p class="d">${s.d}</p><h2 class="q">${F(s.q)}</h2>${s.x?`<div class="ex">${F(s.x)}</div>`:''}<div class="g">${[s.a,...s.o].sort(()=>Math.random()-.5).map(v=>`<button onclick="pick(this,'${v}')">${F(v)}</button>`).join('')}</div><div id="fb"></div>`;
}
function pick(b,v){
 if(lk)return;const s=S[i];
 if(v===s.a){
  lk=1;b.className='ok';const pt=tr?5:10+Math.max(0,5-Math.floor((Date.now()-t0)/6000));sc+=pt;ts[tm]+=pt;tb();$('sc').textContent=D(sc);sOK();say('أحسنتِ! +'+D(pt)+' 🎉');fx('⭐',5);
  $('prop').classList.add('pu');
  $('fb').innerHTML=`<div class="sol">✅ الحل:<div class="ex">${F(s.s)}</div></div><button class="go pl" onclick="pour()">${s.e} ${i<S.length-1?'اسكبي في القدر':'قدّمي الحلوى'}</button>`;
 }else{
  tr=1;b.className='no';b.disabled=true;sNO();say('جرّبي مرة أخرى 🤔');
  $('fb').innerHTML=`<div class="hint">💡 تلميح: ${F(s.h)}</div>`;
 }
}
function pour(){
 const s=S[i],k=i+1,g=$('ing'),last=i==S.length-1;
 $('prop').classList.remove('pu');$('fb').innerHTML='';g.textContent=s.e;sWh();
 g.animate([{transform:'translate(117px,172px) scale(.8)'},{transform:'translate(55px,30px) scale(1.3)',offset:.55},{transform:'translate(0px,62px) scale(.7)'}],{duration:900,easing:'ease-in'}).onfinish=()=>{
  opacity_fix();splash();
  if(last){i++;fin()}else{pot(k);stirGame()}
 };
}
function opacity_fix(){}
function stirGame(){
 mt=20;st=1;say('حرّكي! 💪');
 $('fb').innerHTML=`<div class="sol">🌀 حرّكي الحلوى بسرعة قبل أن تلتصق بالقدر!<div class="mb"><i id="mb"></i></div></div><button class="go" onclick="tap()">حرّكي 🌀</button>`;
}
function tap(){
 if(!st)return;mt=Math.min(100,mt+17);sTp();
 if(mt>=100){st=0;sDone();say('ممم ما أطيبها 😋');fx('✨',8);setTimeout(nx,1100)}
}
function splash(){sSp();fx('💦',6);const q=$('potG');q.classList.remove('wb');void q.getBoundingClientRect();q.classList.add('wb')}
function fx(c,n){
 const g=$('fxg');
 for(let j=0;j<n;j++){
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.textContent=c;t.setAttribute('x',205);t.setAttribute('y',105);t.setAttribute('font-size',17);t.setAttribute('text-anchor','middle');g.appendChild(t);
  const a=Math.random()*6.28,r=40+Math.random()*55;
  t.animate([{transform:'translate(0px,0px)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r-30}px)`,opacity:0}],{duration:800+Math.random()*400}).onfinish=()=>t.remove();
 }
}
function say(t){const b=$('bub');$('bt').textContent=t;b.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>b.style.opacity=0,2300)}
let AC,NB,SM,MU=0;
function ac(){
 if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let j=0;j<n;j++)d[j]=Math.random()*2-1;NB=b;
  const r=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();r.buffer=NB;r.loop=true;f.type='bandpass';f.frequency.value=2600;f.Q.value=.5;g.gain.value=0;r.connect(f);f.connect(g);g.connect(AC.destination);r.start();SM=g}
 if(AC.state==='suspended')AC.resume();return AC}
function tn(f,t=0,d=.15,ty='triangle',v=.12,f2){
 if(MU)return;const a=ac(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;
 o.type=ty;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);
 g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.02)}
function ns(t=0,d=.2,fr=1000,ty='bandpass',v=.15,q=1){
 if(MU)return;const a=ac(),s=a.currentTime+t,r=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
 r.buffer=NB;f.type=ty;f.frequency.value=fr;f.Q.value=q;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
 r.connect(f);f.connect(g);g.connect(a.destination);r.start(s,Math.random()*1.5);r.stop(s+d+.02)}
const sOK=()=>{[523,659,784,1047].forEach((f,j)=>tn(f,j*.09,.22,'triangle',.13));tn(1568,.36,.4,'sine',.07);ns(.3,.3,6000,'highpass',.04)};
const sNO=()=>{tn(260,0,.2,'sawtooth',.08,180);tn(190,.2,.35,'sawtooth',.08,110)};
const sWh=()=>{tn(400,0,.5,'sine',.05,1100);ns(0,.5,1200,'bandpass',.04,.6)};
const sSp=()=>{ns(0,.5,2200,'bandpass',.2,.6);tn(260,0,.18,'sine',.2,90);tn(180,.12,.15,'sine',.12,80)};
const sTp=()=>{tn(170+mt,0,.09,'square',.05,90);ns(0,.08,600,'bandpass',.1,2)};
const sDone=()=>{[523,659,784,1047,1319].forEach((f,j)=>tn(f,j*.08,.3,'triangle',.13))};
const sWin=()=>{[523,523,659,784,659,784,1047].forEach((f,j)=>tn(f,j*.13,.25,'triangle',.14));tn(1319,.95,.6,'sine',.1)};
function mute(){MU=!MU;$('mu').textContent=MU?'🔇':'🔊';if(!MU){ac();sOK()}}
document.addEventListener('pointerdown',()=>{try{ac()}catch(e){}});
function nx(){i++;i<S.length?show():fin()}
function fin(){
 st=0;mt=0;CK=0;mark();say('بالهناء والعافية! 🎉');fx('✨',10);sWin();
 $('potG').style.display='none';$('hearth').style.display='none';$('arm').style.display='none';$('trayG').style.display='';
 $('fl').style.opacity=0;$('sm').style.opacity=0;$('prop').textContent='';
 const mx=S.length*15,t=sc>=mx*.7?3:sc>=mx*.45?2:1;
 const w=Math.max(...ts),win=TN.slice(0,NT).filter((n,j)=>ts[j]==w).join(' و ');
 $('pn').innerHTML=`<h2>الحلوى العُمانية جاهزة! 🎉</h2>${NT>1?`<div class="stars">🏆</div><p style="text-align:center"><b>المجموعة الفائزة: ${win}</b></p>`:`<div class="stars">${'⭐'.repeat(t)}</div><p style="text-align:center">نتيجتك: <b>${D(sc)}</b> من ${D(mx)}</p>`}<div class="cd">🇴🇲 الحلوى العُمانية رمز لكرم الضيافة والاعتزاز بالتراث.<br>لمن ستقدّمين هذه الحلوى؟ وكيف ستحافظين على تراثنا؟</div><div class="vl"><span>كرم الضيافة</span><span>الاعتزاز بالتراث</span><span>التعاون</span></div><button class="go" onclick="intro()">العبي من جديد</button>`;
}
let ph=0,mt=0,st=0,CK=0,lr=0;
document.querySelector('svg').addEventListener('click',tap);
(function lp(){
 ph+=.05+mt*.0022;if(st)mt=Math.max(0,mt-.25);
 const hx=114+6*Math.cos(ph),hy=142+3*Math.sin(ph),tx=205+46*Math.cos(ph),ty=113+6*Math.sin(ph);
 $('sl').setAttribute('d',`M82 148L${hx-6} ${hy+1}`);
 [['cf',hx-6,hy+1],['hd',hx,hy],['bl',tx+2,ty]].forEach(([n,x,y])=>{$(n).setAttribute('cx',x);$(n).setAttribute('cy',y)});
 $('pd').setAttribute('d',`M${hx} ${hy}L${tx} ${ty}`);
 $('sw').style.strokeDashoffset=-ph*14;
 if(AC&&!MU&&CK){const rv=Math.floor(ph/6.283);if(rv!==lr){lr=rv;ns(0,.16,700+mt*8,'bandpass',.05+mt*.0006,.9)}
  if(Math.random()<.02+mt*.0008+CK*.004)tn(180+Math.random()*260,0,.07,'sine',.07,400+Math.random()*300)}
 if(SM)SM.gain.value=(MU||!CK)?0:.012*CK+mt*.0004;
 const m=$('mb');if(m)m.style.width=mt+'%';
 requestAnimationFrame(lp);
})();
intro();
</script>
</body>
</html>
